import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
}

stonecutter {
    properties.tags(('versions:' + current.version).toString())
}

def projectName = stonecutter.current.project
def loader = projectName.substring(projectName.lastIndexOf('-') + 1)
project.version = mod_version

sourceSets.main.java.srcDirs(rootProject.file('common/src/main/java'), rootProject.file(loader + '/src/main/java'))
sourceSets.main.resources.srcDirs(rootProject.file('common/src/main/resources'), rootProject.file(loader + '/src/main/resources'))

tasks.named('stonecutterPrepare') {
    root = rootProject.projectDir
    source.from(rootProject.fileTree('common/src/main/java'), rootProject.fileTree(loader + '/src/main/java'))
}
def mergeTask = tasks.named('stonecutterMerge') {
    doNotTrackState('Merges processed Stonecutter comments into external source roots.')
    into(rootProject.projectDir)
}
tasks.matching { it.name in ['stonecutterPrepareTest', 'stonecutterMergeTest'] }.configureEach {
    enabled = false
}
tasks.matching { it.name in ['compileJava', 'processResources', 'generateDLIConfig', 'prepareClientRun', 'prepareServerRun', 'runClient', 'runServer'] }.configureEach {
    dependsOn(mergeTask)
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn(":stonecutterSwitchTo${stonecutter.current.project}")
}

base {
    archivesName = "${mod_id}-${loader}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version.toString()))
}

repositories {
    mavenCentral()
    def spongeMaven = maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
    }
    exclusiveContent {
        forRepositories(spongeMaven)
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
}

def resourceOutput = layout.buildDirectory.dir('resources/main')

processResources {
    var expandProps = ['version'                         : project.version,
                       'group'                           : project.group,
                       'minecraft_version'               : minecraft_version,
                       'minecraft_version_range_fabric'  : minecraft_version_range_fabric,
                       'minecraft_version_range_neoforge': minecraft_version_range_neoforge,
                       'fabric_version'                  : fabric_version,
                       'fabric_loader_version'           : fabric_loader_version,
                       'neoforge_version'                : neoforge_version,
                       'neoforge_version_range'          : neoforge_version_range,
                       'neoforge_loader_version_range'   : neoforge_loader_version_range,
                       'java_version'                    : java_version,
                       'mod_name'                        : mod_name,
                       'mod_authors'                     : mod_authors,
                       'mod_id'                          : mod_id,
                       'mod_homepage'                    : mod_homepage,
                       'mod_sources'                     : mod_sources,
                       'mod_issues'                      : mod_issues,
                       'license'                         : license,
                       'description'                     : project.description]

    var jsonExpandProps = expandProps.collectEntries { key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['fabric.mod.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)

    doLast {
        def output = resourceOutput.get().asFile
        def writeJson = { file, value -> file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)), 'UTF-8') }

        if (stonecutter.eval(minecraft_version, '>=1.21.2')) {
            new File(output, "data/${mod_id}/recipe").eachFileMatch(~/.*\.json/) { file ->
                def recipe = new JsonSlurper().parse(file)
                recipe.key.each { symbol, ingredient -> recipe.key[symbol] = ingredient.item ?: "#${ingredient.tag}" }
                recipe.result.id = recipe.result.remove('item')
                writeJson(file, recipe)
            }
        }

        if (stonecutter.eval(minecraft_version, '>=1.21.4')) {
            def itemModels = new File(output, "assets/${mod_id}/models/item")
            def itemDefinitions = new File(output, "assets/${mod_id}/items")
            itemDefinitions.mkdirs()
            itemModels.eachFileMatch(~/.*\.json/) { model ->
                writeJson(new File(itemDefinitions, model.name), [model: [type: 'minecraft:model', model: "${mod_id}:item/${model.name - '.json'}"]])
            }
        }
    }
}