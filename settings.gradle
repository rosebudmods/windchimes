pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        def fabricMaven = maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net')
        }
        exclusiveContent {
            forRepositories(fabricMaven)
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }

    plugins {
        id 'net.fabricmc.fabric-loom' version '1.17.12'
        id 'net.fabricmc.fabric-loom-remap' version '1.17.12'
        id 'net.neoforged.moddev' version '2.0.141'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.6'
}

rootProject.name = 'windchimes'

apply from: 'gradle/stonecutter-targets.gradle'

def versionTargets = ext.versionTargets
def devTasks = ext.devTasks
def targetVersion = ext.targetVersion
def targetLoader = ext.targetLoader
def buildTargets = ext.buildTargets
def taskNames = gradle.startParameter.taskNames
def scTarget = gradle.startParameter.projectProperties['scTarget']
def activeTarget = file('.sc_active_version').exists() ? file('.sc_active_version').text.trim() : baseTarget
def useIndex = taskNames.indexOf('use')
if (useIndex >= 0 && useIndex + 1 < taskNames.size()) {
    def version = versionTargets[taskNames.get(useIndex + 1)]
    if (version) activeTarget = "${version}-${baseLoader}"
}
if (taskNames.contains('reset')) activeTarget = baseTarget
def activeVersion = targetVersion(activeTarget)
def requestedLoader = devTasks.find { taskNames.contains(it.key) }?.value?.loader
if (requestedLoader) activeTarget = "${activeVersion}-${requestedLoader}"
if (scTarget) {
    if (!buildTargets(null).contains(scTarget)) throw new GradleException("Unknown Stonecutter target: ${scTarget}")
    activeTarget = scTarget
}

stonecutter {
    kotlinController = false
}

stonecutter.create(rootProject) {
    def loader = targetLoader(activeTarget)
    delegate.version(activeTarget, targetVersion(activeTarget)).buildscript = "build.${loader}.gradle".toString()
    vcsVersion = activeTarget
}