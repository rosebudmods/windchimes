plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom' apply false
    id 'net.fabricmc.fabric-loom-remap' apply false
}

def deobfuscated = stonecutter.eval(minecraft_version, '>=26')
apply plugin: deobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!deobfuscated) mappings loom.officialMojangMappings()
    def modConfig = deobfuscated ? 'implementation' : 'modImplementation'
    add(modConfig, "net.fabricmc:fabric-loader:${fabric_loader_version}")
    add(modConfig, "net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    if (variant in configurations.names) {
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}