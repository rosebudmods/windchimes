ext.baseVersion = '1.21.1'
ext.baseLoader = 'fabric'
ext.baseTarget = "${baseVersion}-${baseLoader}".toString()
ext.versionTargets = [
        '1.21'   : '1.21.1',
        '1.21.1' : '1.21.1',
        '1.21.2' : '1.21.2',
        '1.21.3' : '1.21.2',
        '1.21.4' : '1.21.4',
        '1.21.5' : '1.21.5',
        '1.21.6' : '1.21.6',
        '1.21.7' : '1.21.6',
        '1.21.8' : '1.21.6',
        '1.21.9' : '1.21.9',
        '1.21.10': '1.21.9',
        '1.21.11': '1.21.11',
        '26.1'   : '26.1',
        '26.1.1' : '26.1',
        '26.1.2' : '26.1',
        '26.2'   : '26.2'
]
ext.devTasks = [
        clientFabric  : [loader: 'fabric', run: 'runClient', name: 'Fabric client'],
        serverFabric  : [loader: 'fabric', run: 'runServer', name: 'Fabric server'],
        clientNeoForge: [loader: 'neoforge', run: 'runClient', name: 'NeoForge client'],
        serverNeoForge: [loader: 'neoforge', run: 'runServer', name: 'NeoForge server']
]
ext.targetVersion = { String target ->
    int index = target.lastIndexOf('-')
    if (index < 1) throw new GradleException("Invalid Stonecutter target: ${target}")
    target.substring(0, index)
}
ext.targetLoader = { String target ->
    int index = target.lastIndexOf('-')
    if (index < 1 || index == target.length() - 1) throw new GradleException("Invalid Stonecutter target: ${target}")
    target.substring(index + 1)
}
ext.buildTargets = { String requested ->
    def versions = requested ? [requested] : versionTargets.values().toList().unique()
    versions.collectMany { version -> ['fabric', 'neoforge'].collect { loader -> "${version}-${loader}" } }
}
ext.finalJarTask = { String target ->
    target.endsWith('-neoforge') || !targetVersion(target).startsWith('1.') ? 'jar' : 'remapJar'
}