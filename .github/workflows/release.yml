name: Release

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Markdown release notes
        required: true
        type: string
      dry_run:
        description: Build without uploading
        default: true
        type: boolean
      publish_modrinth:
        description: Publish to Modrinth
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew buildJars --console plain

      - run: >-
          ./gradlew publishMods
          -PpublishDryRun=${{ inputs.dry_run }}
          -PpublishModrinth=${{ inputs.publish_modrinth }}
          --console plain
        env:
          CHANGELOG: ${{ inputs.changelog }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
